components:
  schemas:
    CreateFunctionRequest:
      type: object
      description: Request body for creating a function
      properties:
        name:
          type: string
          description: Name of the function
          example: hello-world
        environment:
          type: string
          description: Environment name
          example: python
        package_name:
          type: string
          description: Package name to use
        entrypoint:
          type: string
          description: Entry point function name
        executor_type:
          type: string
          description: Executor type (poolmgr, newdeploy, container)
        code:
          type: string
          description: Source code for the function
        source_archive:
          type: string
          description: Source archive URL or path
        deploy_archive:
          type: string
          description: Deployment archive URL or path
        source_checksum:
          type: string
          description: Source archive checksum
        deploy_checksum:
          type: string
          description: Deployment archive checksum
        insecure:
          type: boolean
          description: Allow insecure connections
        build_command:
          type: string
          description: Build command for the package
        secrets:
          type: array
          items:
            type: string
          description: List of secret names
        configmaps:
          type: array
          items:
            type: string
          description: List of configmap names
        specialization_timeout:
          type: integer
          description: Specialization timeout in seconds
        execution_timeout:
          type: integer
          description: Execution timeout in seconds
        idle_timeout:
          type: integer
          description: Idle timeout in seconds
        concurrency:
          type: integer
          description: Function concurrency limit
        requests_per_pod:
          type: integer
          description: Requests per pod
        once_only:
          type: boolean
          description: Execute function only once
        retain_pods:
          type: integer
          description: Number of pods to retain
        labels:
          type: object
          additionalProperties:
            type: string
          description: Labels to apply
        annotations:
          type: object
          additionalProperties:
            type: string
          description: Annotations to apply
        min_cpu:
          type: string
          description: Minimum CPU resource
        max_cpu:
          type: string
          description: Maximum CPU resource
        min_memory:
          type: string
          description: Minimum memory resource
        max_memory:
          type: string
          description: Maximum memory resource
        min_scale:
          type: integer
          description: Minimum number of replicas
        max_scale:
          type: integer
          description: Maximum number of replicas
        target_cpu:
          type: integer
          description: Target CPU percentage
        namespace:
          type: string
          description: Kubernetes namespace
        url:
          type: string
          description: HTTP trigger URL (if creating trigger)
        method:
          type: string
          description: HTTP method for trigger
        prefix:
          type: string
          description: URL prefix for trigger
        spec_save:
          type: boolean
          description: Save to spec file
        spec_dry:
          type: boolean
          description: Dry run mode
      required:
        - name

    ErrorResponse:
      type: object
      description: Error response
      properties:
        error:
          type: string
          description: Error message
          example: "An error occurred"
      required:
        - error
